[project]
name = "plannings-tool"
version = "0.1.0"
description = "Validate YAML course definitions and preview course schedules"
readme = "README.md"
authors = [
    { name = "Michiel Tukker", email = "michiel.tukker@deltares.nl" }
]
requires-python = ">=3.14"
dependencies = [
    "email-validator>=2.4.0",
    "matplotlib>=3.8",
    "pydantic>=2,<3",
    "pillow>=10",
    "pyyaml>=6.0.3",
    "reportlab>=4",
    "rich>=15.0.0",
    "typer>=0.29.1",
    "tzdata>=2026.6",
    "jinja2>=3.1",
]

[project.scripts]
plan = "plannings_tool.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pypdf>=5",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "UP", "SIM", "RUF", "PT", "RET"]
